# Add inside the existing radio.pickpocketradio.org server { ... } block.
# Keep the current /pocket-control/ proxy for status/NEXT unchanged.

location ^~ /pocket-control/api/talk/ {
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # PCM chunks are small and latency matters more than buffering.
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 2m;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-Sample-Rate, X-Channels" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}
