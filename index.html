<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>POCKET MOBILE RADIO CONTROL</title><style>:root{--p:#ff1688;--a:#eaff00;--c:#f5ecd8;--o:#ff5a00;--b:#050505}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:#050505;color:var(--c);font-family:Arial,Helvetica,sans-serif}body{display:flex;justify-content:center}#app{width:240px;height:282px;padding:5px 7px;background:#050505;overflow:hidden}.hero{height:103px;display:flex;align-items:center;border-bottom:2px solid var(--p);position:relative}.logo{width:102px;height:102px;object-fit:contain;flex:none}.state{flex:1;text-align:center}.air{display:inline-block;border:1.5px solid var(--p);color:var(--p);font-size:10px;font-weight:900;padding:4px 5px;border-radius:5px;white-space:nowrap}.count{font-size:30px;line-height:29px;font-weight:1000;color:var(--a);margin-top:6px}.countlabel{font-size:8px;font-weight:900}.card{height:49px;padding:4px 2px;border-bottom:1px solid var(--p);position:relative}.label{font-size:10px;font-weight:1000}.current .label{color:var(--p)}.next .label{color:var(--a)}.artist{font-size:12px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:2px}.track{font-size:9px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:2px}.controls{height:64px;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding-top:5px}.btn{border:0;border-radius:8px;color:#000;font-weight:1000;font-size:15px;touch-action:none}.talk{background:var(--a)}.talk.live{background:var(--o)}.skip{background:var(--p)}.sub{display:block;font-size:7px;margin-top:1px}.foot{height:10px;text-align:center;font-size:6px;color:#666;line-height:10px}.error{color:var(--o)}</style></head><body><main id="app"><section class="hero"><img class="logo" src="POCKET-MOBILE-RADIO-CONTROL_logo.png" alt="POCKET MOBILE RADIO CONTROL"><div class="state"><div class="air">● ON AIR</div><div class="count" id="listeners">—</div><div class="countlabel">LISTENERS</div></div></section><section class="card current"><div class="label">CURRENT</div><div class="artist" id="currentArtist">Loading…</div><div class="track" id="currentTrack">Pick Pocket Radio</div></section><section class="card next"><div class="label">NEXT</div><div class="artist" id="nextArtist">Loading…</div><div class="track" id="nextTrack">SONO PLAY MINI LIVE</div></section><section class="controls"><button class="btn talk" id="talk">🎙 TALK<span class="sub">HOLD</span></button><button class="btn skip" id="skip">≫ NEXT<span class="sub">SKIP</span></button></section><div class="foot" id="foot">RABBIT r1 · SONO TEST</div></main><script>
const $=id=>document.getElementById(id);
const CONTROL='https://radio.pickpocketradio.org/rabbit-test';
const SCHED='https://toutvabiensepasser.com/SONO-PLAY-MINI-LIVE/index.php';
const ICE='https://radio.pickpocketradio.org/status-json.xsl';
function split(v){v=(v||'').toString().trim();let p=v.split(/\s[-–—]\s/);return p.length>1?[p.shift(),p.join(' — ')]:['',v||'—']}
async function json(url,opt){let r=await fetch(url,{cache:'no-store',...opt});if(!r.ok)throw Error(r.status);return r.json()}
function setTrack(prefix,obj){obj=obj||{};let raw=typeof obj==='string'?obj:(obj.title||obj.filename||obj.name||obj.track||'');let [a,t]=split(raw);$(prefix+'Artist').textContent=obj.artist||a||(prefix==='current'?'ON AIR':'NEXT');$(prefix+'Track').textContent=obj.track||obj.title&&obj.artist?obj.title:(t||raw||'—')}
function iceListeners(d){let s=d?.icestats?.source;if(Array.isArray(s))s=s.find(x=>(x.listenurl||'').includes('/stream.mp3'))||s[0];return s?.listeners??d?.listeners??null}
async function refresh(){let ok=false,notes=[];
 try{let d=await json(CONTROL+'/api/status');$('listeners').textContent=d.listeners??d.public_listeners??0;setTrack('current',d.current||d.now);setTrack('next',d.next);ok=true;notes.push('CTRL')}catch(e){notes.push('CTRL×')}
 if(!ok){try{let [now,prog]=await Promise.all([json(SCHED+'?action=now'),json(SCHED+'?action=program')]);let c=now.current||now.now||now.item||now;let n=prog.next||prog.upcoming?.[0]||prog.program?.[0]||prog.items?.[0]||{};setTrack('current',c);setTrack('next',n);ok=true;notes.push('SONO')}catch(e){notes.push('SONO×')}}
 try{let d=await json(ICE);let l=iceListeners(d);if(l!==null)$('listeners').textContent=l;notes.push('ICE')}catch(e){notes.push('ICE×')}
 $('foot').className='foot'+(ok?'':' error');$('foot').textContent=ok?('LIVE · '+notes.join(' ')):('NO DATA · '+notes.join(' '));
}
async function goNext(){$('skip').disabled=true;$('skip').textContent='…';try{await json(CONTROL+'/api/next',{method:'POST'});setTimeout(refresh,650)}catch(e){$('foot').className='foot error';$('foot').textContent='NEXT BACKEND OFFLINE'}setTimeout(()=>{$('skip').disabled=false;$('skip').innerHTML='≫ NEXT<span class="sub">SKIP</span>'},900)}
$('skip').onclick=goNext;let t=$('talk');function down(e){e?.preventDefault();t.classList.add('live');t.innerHTML='● TALK<span class="sub">MIC PHASE 2</span>';navigator.vibrate?.(25)}function up(e){e?.preventDefault();t.classList.remove('live');t.innerHTML='🎙 TALK<span class="sub">HOLD</span>'}t.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(x=>t.addEventListener(x,up));refresh();setInterval(refresh,4000)
</script></body></html>
