<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=240,height=282,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>POCKET MOBILE RADIO CONTROL</title><style>
*{box-sizing:border-box}html,body{margin:0;width:240px;height:282px;overflow:hidden;background:#000;color:#f6efdf;font-family:Arial,sans-serif}
main{width:240px;height:282px;padding:5px 7px}.top{display:flex;gap:6px;align-items:center}.logo{width:72px;height:72px;object-fit:contain}.info{width:148px}.state{font-size:9px;font-weight:900;color:#efff00}.label{font-size:6px;letter-spacing:1px;color:#ff238c;margin-top:4px}.track{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.meter{height:4px;background:#222;margin-top:4px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#ff238c}.row{display:flex;gap:5px;margin-top:5px}.row button{flex:1}.full{width:100%}button{height:31px;border:1px solid #333;border-radius:7px;background:#101010;color:#f6efdf;font-size:9px;font-weight:900;letter-spacing:.5px}.pink{background:#ff238c;color:#000}.lime{background:#efff00;color:#000}.cream{background:#f6efdf;color:#000}button:disabled{opacity:.3}.rec{font-size:7px;text-align:center;margin-top:4px;letter-spacing:1px}.rec.on{color:#ff238c}
</style></head><body><main>
<div class="top"><img class="logo" id="logo"><div class="info"><div class="state" id="state">OFF AIR</div><div class="label">NOW PLAYING</div><div class="track" id="current">—</div><div class="label">NEXT</div><div class="track" id="coming">—</div><div class="meter"><i id="meter"></i></div></div></div>

<button id="ptt" class="full pink" style="display:block;height:42px;font-size:11px;margin:5px 0">HOLD PTT TO TALK</button><div class="row"><button id="next" class="lime">NEXT</button><button id="jingle">JINGLE</button></div>


<div id="rec" class="rec">REC OFF · POCKET MOBILE RADIO CONTROL</div>
<script>
const API='https://debian.tail394dbb.ts.net/live/',$=x=>document.getElementById(x);let stream,ctx,src,proc,queue=Promise.resolve(),active=false;
$('logo').src='POCKET-MOBILE-RADIO-CONTROL_logo.png?v=9';
async function api(p,o={}){let r=await fetch(API+p,o);if(!r.ok)throw Error(await r.text());return r.json()}
async function tracks(){try{let x=await api('api/tracks');$('current').textContent=x.current||'—';$('coming').textContent=x.next||'—'}catch(e){}}
function ui(s){$('state').textContent='SONO PLAY';$('rec').textContent='POCKET MOBILE RADIO CONTROL'}
function pcm(ev){if(!active)return;let input=ev.inputBuffer.getChannelData(0),out=new Int16Array(input.length*2),peak=0;for(let i=0;i<input.length;i++){let v=Math.max(-1,Math.min(1,input[i]));peak=Math.max(peak,Math.abs(v));v=Math.max(-1,Math.min(1,v*8));let q=v<0?v*32768:v*32767;out[i*2]=q;out[i*2+1]=q}$('meter').firstChild.style.width=(peak*100)+'%';let blob=new Blob([out.buffer],{type:'application/octet-stream'});queue=queue.then(()=>fetch(API+'api/pcm',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:blob})).catch(()=>{$('state').textContent='MIC SEND ERROR'})}
$('next').onclick=async()=>{try{await api('api/next',{method:'POST'});setTimeout(tracks,700)}catch(e){$('state').textContent='NEXT ERROR'}};$('jingle').onclick=async()=>{try{await api('api/jingle',{method:'POST'})}catch(e){$('state').textContent='JINGLE SOON'}};

let mediaStream=null,recorder=null,sendChain=Promise.resolve(),talking=false;
async function voiceStart(){
 if(talking)return; talking=true;
 try{
  $('state').textContent='CONNECTING LIVE…';
  mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
  await api('api/stream-start',{method:'POST'});
  recorder=new MediaRecorder(mediaStream,{mimeType:'audio/webm;codecs=opus'});
  recorder.ondataavailable=e=>{if(!e.data||!e.data.size)return; const blob=e.data; sendChain=sendChain.then(async()=>{let r=await fetch(API+'api/stream-chunk',{method:'POST',headers:{'Content-Type':blob.type},body:blob});if(!r.ok)throw Error();$('state').textContent='● LIVE VOICE'}).catch(()=>{$('state').textContent='LIVE RETRY'})};
  recorder.start(500); $('ptt').textContent='● LIVE — RELEASE';
 }catch(e){talking=false;$('state').textContent='MIC ERROR';if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop())}
}
async function voiceStop(){
 if(!talking)return; talking=false;
 if(recorder&&recorder.state==='recording')recorder.stop();
 if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());
 try{if(recorder&&recorder.state==='recording')recorder.requestData()}catch(e){} await new Promise(r=>setTimeout(r,650)); await sendChain.catch(()=>{}); try{await api('api/stream-stop',{method:'POST'})}catch(e){}
 $('state').textContent='SONO PLAY';$('ptt').textContent='HOLD PTT — LIVE VOICE';
}
$('ptt').textContent='HOLD PTT — LIVE VOICE';
$('ptt').onpointerdown=voiceStart;$('ptt').onpointerup=voiceStop;$('ptt').onpointercancel=voiceStop;
window.addEventListener('longPressStart',voiceStart);window.addEventListener('longPressEnd',voiceStop);
setInterval(tracks,1500);tracks();
</script></main></body></html>
