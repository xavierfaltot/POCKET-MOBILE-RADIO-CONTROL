<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>POCKET MOBILE RADIO CONTROL</title><style>:root{--p:#ff1688;--a:#eaff00;--c:#f5ecd8;--o:#ff5a00}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#050505;color:var(--c);font-family:Arial,Helvetica,sans-serif}body{display:flex;justify-content:center}#app{width:240px;height:282px;padding:2px 4px;overflow:hidden;background:#050505}.hero{height:137px;display:flex;align-items:center;border-bottom:2px solid var(--p);position:relative}.logo{width:170px;height:170px;object-fit:contain;flex:none;margin-left:-17px;margin-right:-7px}.state{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}.air{border:1.5px solid var(--p);color:var(--p);font-size:9px;font-weight:1000;padding:4px 5px;border-radius:5px;white-space:nowrap}.count{font-size:29px;line-height:28px;font-weight:1000;color:var(--a);margin-top:7px}.countlabel{font-size:7px;font-weight:1000}.card{height:38px;border-bottom:1.5px solid var(--p);padding:3px 2px;overflow:hidden}.label{font-size:9px;font-weight:1000;line-height:9px}.current .label{color:var(--p)}.next .label{color:var(--a)}.artist{font-size:10px;font-weight:1000;line-height:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}.track{font-size:8px;line-height:9px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{height:59px;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding-top:4px}.btn{border:0;border-radius:8px;color:#000;font-weight:1000;font-size:14px;touch-action:none}.talk{background:var(--a)}.talk.live{background:var(--o)}.skip{background:var(--p)}.sub{display:block;font-size:6px;margin-top:1px}.foot{text-align:center;height:7px;font-size:5px;color:#666;line-height:7px;white-space:nowrap;overflow:hidden}.error{color:var(--o)}</style></head><body><main id="app"><section class="hero"><img class="logo" src="POCKET-MOBILE-RADIO-CONTROL_logo.png"><div class="state"><div class="air">● ON AIR</div><div class="count" id="listeners">—</div><div class="countlabel">LISTENERS</div></div></section><section class="card current"><div class="label">CURRENT</div><div class="artist" id="currentArtist">Loading…</div><div class="track" id="currentTrack">Pick Pocket Radio</div></section><section class="card next"><div class="label">NEXT</div><div class="artist" id="nextArtist">Loading…</div><div class="track" id="nextTrack">SONO PLAY MINI LIVE</div></section><section class="controls"><button class="btn talk" id="talk">🎙 TALK<span class="sub">HOLD TO TALK</span></button><button class="btn skip" id="skip">≫ NEXT<span class="sub">SKIP TO NEXT</span></button></section><div class="foot" id="foot">POCKET CONTROL · SONO TEST</div></main><script>const $=id=>document.getElementById(id),CONTROL='https://radio.pickpocketradio.org/pocket-control',ICE='https://radio.pickpocketradio.org/status-json.xsl';async function json(url,opt){let r=await fetch(url,{cache:'no-store',...opt});if(!r.ok)throw Error(r.status);return r.json()}function pretty(v){return (v||'—').replace(/_/g,' ').replace(/\s+/g,' ').trim()}function setTrack(prefix,obj){obj=obj||{};let title=pretty(obj.title||obj.file||obj.filename||obj.name||obj.track||'—');$(prefix+'Artist').textContent=prefix==='current'?'ON AIR':'UP NEXT';$(prefix+'Track').textContent=title}function iceListeners(d){let s=d?.icestats?.source;if(Array.isArray(s))s=s.find(x=>(x.listenurl||'').includes('/stream.mp3'))||s[0];return s?.listeners??d?.listeners??null}async function refresh(){let ok=false,notes=[];try{let d=await json(CONTROL+'/api/status');if(!d.ok)throw Error(d.error||'API');$('listeners').textContent=d.listeners??0;setTrack('current',d.current);setTrack('next',d.next);ok=true;notes.push('CTRL')}catch(e){notes.push('CTRL×');try{let d=await json(ICE);let l=iceListeners(d);if(l!==null)$('listeners').textContent=l;notes.push('ICE')}catch(x){notes.push('ICE×')}}$('foot').className='foot'+(ok?'':' error');$('foot').textContent=ok?'LIVE · '+notes.join(' '):'NO CONTROL · '+notes.join(' ')}async function goNext(){$('skip').disabled=true;$('foot').textContent='NEXT…';try{let r=await fetch(CONTROL+'/api/next',{method:'POST',cache:'no-store'});if(!r.ok)throw Error(r.status);setTimeout(refresh,1200)}catch(e){$('foot').className='foot error';$('foot').textContent='NEXT BACKEND OFFLINE'}setTimeout(()=>{$('skip').disabled=false},1600)}$('skip').onclick=goNext;let t=$('talk');function down(e){e?.preventDefault();t.classList.add('live')}function up(e){e?.preventDefault();t.classList.remove('live')}t.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(x=>t.addEventListener(x,up));refresh();setInterval(refresh,4000)</script></body></html>
